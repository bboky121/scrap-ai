name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read, packages: write }
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:node:check
      - run: pnpm --filter @kis/api prisma:generate
      - run: pnpm --filter @kis/api test
      - run: pnpm --filter @kis/api build
      # Pull requests validate the web build here. Pushes build it once in the
      # Docker job below, avoiding a duplicate production build on main.
      - if: github.event_name == 'pull_request'
        run: pnpm --filter @kis/web build
      - run: pnpm --filter @kis/mobile typecheck
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip, cache-dependency-path: apps/pipeline/pyproject.toml }
      - run: pip install './apps/pipeline[dev]'
      - run: ruff format --check apps/pipeline
      - run: ruff check apps/pipeline
      - run: pytest apps/pipeline
      - run: mypy --config-file apps/pipeline/pyproject.toml apps/pipeline/pipeline
      - run: docker compose config
  docker:
    if: github.event_name == 'push'
    needs: [node, python]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, file: apps/web/Dockerfile }
          - { name: api, file: apps/api/Dockerfile }
          - { name: pipeline, file: apps/pipeline/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: '${{ matrix.file }}'
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kis-brief-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kis-brief-${{ matrix.name }}:latest
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          {
            image-ref: 'ghcr.io/${{ github.repository_owner }}/kis-brief-${{ matrix.name }}:${{ github.sha }}',
            severity: 'HIGH,CRITICAL',
            exit-code: '1',
            ignore-unfixed: true,
            trivyignores: '.trivyignore',
          }
      - name: Push verified image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/kis-brief-${{ matrix.name }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/kis-brief-${{ matrix.name }}:latest
