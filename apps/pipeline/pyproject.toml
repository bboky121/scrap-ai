[project]
name = "kis-brief-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.155.0,<1", "uvicorn[standard]>=0.54.0,<1", "celery[redis]>=5.6.3,<6",
  "redis>=8.1.0,<9", "httpx>=0.28.1,<1", "pydantic-settings>=2.16.1,<3",
  "sqlalchemy>=2.1.5,<3", "psycopg[binary]>=3.3.6,<4", "beautifulsoup4>=4.15.0,<5"
]
[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "respx>=0.23.1,<1", "ruff>=0.17.1,<1", "mypy>=2.4.0,<3", "types-beautifulsoup4>=4.12.0.20250516"]
[tool.ruff]
line-length = 500
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
