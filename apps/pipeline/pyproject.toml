[project]
name = "kis-brief-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1", "uvicorn[standard]>=0.52.3,<1", "celery[redis]>=5.6.3,<6",
  "redis>=5.2,<6", "httpx>=0.28.1,<1", "pydantic-settings>=2.15.0,<3",
  "sqlalchemy>=2.0.52,<3", "psycopg[binary]>=3.3.4,<4", "beautifulsoup4>=4.15.0,<5"
]
[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=6,<7", "respx>=0.22,<1", "ruff>=0.16.4,<1", "mypy>=2.3.1,<3", "types-beautifulsoup4>=4.12.0.20250516"]
[tool.ruff]
line-length = 500
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
